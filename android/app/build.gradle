plugins { id 'com.android.application' }

android {
    namespace 'org.badboyztv.toptier'
    compileSdk 35

    defaultConfig {
        applicationId 'org.badboyztv.toptier'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
