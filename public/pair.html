<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050912">
  <title>Connect Top Tier Player</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/logo.css">
</head>
<body>
  <main class="screen centered">
    <form id="phonePairForm" class="panel auth-card">
      <div class="brand"><img src="/top-tier-logo.png" alt="Top Tier Player"></div>
      <h1>Connect your TV</h1>
      <p class="muted">Enter your authorized provider details. They will be sent securely to the TV and cleared after pairing.</p>
      <div class="mode-switch"><button type="button" class="mode active" data-mode="xtream">XTREAM</button><button type="button" class="mode" data-mode="m3u">M3U</button></div>
      <div id="phoneXtreamFields">
        <label>Server URL<input id="phoneServerUrl" inputmode="url" autocomplete="url" placeholder="https://your-domain.com:port" required></label>
        <label>Username<input id="phoneUsername" autocomplete="username" required></label>
        <label>Password<input id="phonePassword" type="password" autocomplete="current-password" required></label>
      </div>
      <div id="phoneM3uFields" hidden>
        <label>Playlist URL<input id="phoneM3uUrl" inputmode="url" autocomplete="url" placeholder="https://provider.com/playlist.m3u" required></label>
      </div>
      <button class="primary" id="sendPair" type="submit">CONNECT MY TV</button>
      <p id="phoneStatus" class="muted" role="status"></p>
    </form>
  </main>
  <script src="/pair-page.js"></script>
</body>
</html>
