name: Build Top Tier Player APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fire-tv-apk:
    name: Build Fire TV / Android TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out player source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build sideload APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.1
          name: Top Tier Player v0.7.1
          body: Fire TV and Android TV hotfix: stable native playback and automatic recovery if the WebView renderer stops.
          files: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Top-Tier-Player-FireTV-AndroidTV-v0.7.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
