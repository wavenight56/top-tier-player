name: Build Top Tier APK
on:
  workflow_dispatch:
  push:
    branches: ['main']
permissions:
  contents: write
concurrency:
  group: top-tier-android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check player scripts
        run: npm run check
      - name: Build installable APK
        working-directory: android
        run: gradle assembleDebug
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Top-Tier-Player-0.4.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Top-Tier-Player-0.4.0
          path: Top-Tier-Player-0.4.0.apk
      - name: Publish installable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-0.4.0-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Top-Tier-Player-0.4.0.apk --target "$GITHUB_SHA" --prerelease --title "Top Tier Player 0.4.0" --notes "Installable Android preview: bundled interface, direct HTTP/HTTPS provider connections, native playback, and series episodes. Provider/device playback still requires testing. Debug-signed; an older installation signed with a different key must be removed before installing."
